services:
  api:
    build:
      context: ./build-context
    restart: unless-stopped
    depends_on:
      - mongodb
      - meilisearch
    env_file:
      - ./runtime.env
    ports:
      - "127.0.0.1:3080:3080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../librechat.yaml:/app/librechat.yaml:ro
      - uploads:/app/uploads
      - images:/app/client/public/images
      - logs:/app/api/logs
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb:/data/db
  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:7701:7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: mygpt2-local-search-key
    volumes:
      - meilisearch:/meili_data
  dashboard:
    build:
      context: ../flask-app
      dockerfile: Dockerfile.flask
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ../flask-app:/app
volumes:
  uploads:
  images:
  logs:
  mongodb:
  meilisearch:
